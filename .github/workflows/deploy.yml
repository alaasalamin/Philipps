name: Deploy to server

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 217.160.255.189 >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key root@217.160.255.189 << 'EOF'
            set -e
            cd /var/www/philipps-app
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            pm2 restart philipps --update-env
          EOF
